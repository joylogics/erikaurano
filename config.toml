baseURL = "https://erikaurano.com/"
title = "Erika Urano"
theme = "erikaurano-theme"

[mediaTypes]
  [mediaTypes."application/vnd.apple.mpegurl"]
    suffixes = ["m3u8"]

  [mediaTypes."video/MP2T"]
    suffixes = ["ts"]

[outputFormats]
  [outputFormats.M3U8]
    mediaType = "application/vnd.apple.mpegurl"
    baseName = "index"
    isPlainText = true
    notAlternative = true

[params]
  # SEO Settings
  description = "Erika Urano is a filmmaker, editor, and artist based in New York City. She makes narrative films and production design, and helps artists and small businesses with short-form video and social content."

  # LinkedIn (replaces the template's Instagram icon in the header)
  linkedin = "https://www.linkedin.com/in/erikaurano/"

  # Contact form endpoint. Create a Formspree form pointed at hello@erikaurano.com
  # and replace the id below before publishing to PROD. Free tier, no cost.
  formspree = "https://formspree.io/f/REPLACE_WITH_FORM_ID"
  contactEmail = "hello@erikaurano.com"

  # Primary navigation: two buckets (Video, Art) plus Contact.
  # Sub-navigation within each bucket is defined in partials/sub-nav.html.
  [[params.navItems]]
    name = "Video"
    url = "/films/"

  [[params.navItems]]
    name = "Art"
    url = "/art/"

  [[params.navItems]]
    name = "Contact"
    url = "/contact/"

  [[params.films]]
    title = "Nowhere to Hide"
    playlist = "/films/NowhereToHide/master.m3u8"
    preview = "/images/NowhereToHide.jpg"
    roles = ["Director", "Writer"]
    year = "2023"

  [[params.films]]
    title = "The Room without Walls"
    playlist = "/films/TheRoomWithoutWalls/master.m3u8"
    preview = "/images/TheRoomWithoutWalls.jpg"
    roles = ["Director", "Production Designer"]
    year = "2022"

  [[params.films]]
    title = "Ton Poertefeuille"
    playlist = "/films/TonPoertefeuille/master.m3u8"
    preview = "/images/TonPoertefeuille.jpg"
    roles = ["Writer", "Production Designer"]
    year = "2022"

  [[params.films]]
    title = "You Loved to Dance"
    playlist = "/films/YouLovedToDance/master.m3u8"
    preview = "/images/YouLovedToDance.jpg"
    roles = ["Director"]
    year = "2021"
