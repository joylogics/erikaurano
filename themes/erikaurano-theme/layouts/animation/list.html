{{ define "main" }}
  {{/* Animation page (/art/animation/). Same grid treatment as Paintings. */}}
  <div id="body-content" class="section-page">
    {{ partial "sub-nav.html" . }}
    <div class="stills-grid art-grid">
      {{ range $i, $p := .Pages.ByWeight }}
        <a class="still-card" href="{{ $p.Permalink }}">
          <div class="still-media">
            <img src="{{ with $p.Params.thumbnail }}{{ . }}{{ else }}{{ $p.Params.image }}{{ end }}" alt="{{ $p.Title }}" loading="{{ cond (lt $i 4) "eager" "lazy" }}">
            <div class="still-overlay">
              <h3 class="still-title">{{ $p.Title }}</h3>
              {{ with $p.Params.medium }}<p class="still-credit">{{ . }}</p>{{ end }}
            </div>
          </div>
        </a>
      {{ end }}
    </div>
  </div>
{{ end }}
