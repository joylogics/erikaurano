{{ define "main" }}
  <div id="body-content" class="section-page">
    {{ partial "sub-nav.html" . }}
    <div class="stills-grid social-grid">
      {{ range .Pages.ByWeight }}
        <a class="still-card social-card" href="{{ .Params.link }}" target="_blank" rel="noopener noreferrer" aria-label="View {{ .Title }} on Instagram">
          <div class="still-media portrait">
            <img src="{{ .Params.preview }}" alt="{{ .Title }}" loading="lazy">
            <div class="still-overlay">
              <h3 class="still-title">{{ .Title }}</h3>
              <p class="still-credit">{{ with .Params.credit }}{{ . }}{{ else }}{{ delimit .Params.roles ", " }}{{ end }}</p>
              <span class="still-ext">View on Instagram &#8599;</span>
            </div>
          </div>
        </a>
      {{ end }}
    </div>
  </div>
{{ end }}
