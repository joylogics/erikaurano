{{ define "main" }}
  <div id="body-content" class="section-page">
    {{ partial "sub-nav.html" . }}
    <div class="stills-grid pd-grid">
      {{ range .Pages.ByWeight }}
        <a class="still-card" href="{{ .Permalink }}">
          <div class="still-media">
            <img src="{{ .Params.hero_image }}" alt="{{ .Title }}" loading="lazy">
            <div class="still-overlay">
              <h3 class="still-title">{{ .Title }}</h3>
            </div>
          </div>
        </a>
      {{ end }}
    </div>
  </div>
{{ end }}
