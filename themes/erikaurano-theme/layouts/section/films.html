{{ define "main" }}
  <div id="body-content" class="section-page">
    {{ partial "sub-nav.html" . }}
    <div class="stills-grid pd-grid">
      {{ range $i, $p := (where .Pages.ByWeight "Params.roles" "intersect" (slice "Director" "Writer")) }}
        <a class="still-card" href="{{ $p.Permalink }}">
          <div class="still-media">
            {{ with $p.Params.preview }}
              <img src="{{ . }}" alt="{{ $p.Title }}" loading="{{ cond (lt $i 3) "eager" "lazy" }}">
            {{ end }}
            <div class="still-overlay">
              <h3 class="still-title">{{ $p.Title }}</h3>
              {{ with $p.Description }}<p class="still-credit">{{ . }}</p>{{ end }}
            </div>
          </div>
        </a>
      {{ end }}
    </div>
  </div>
{{ end }}
